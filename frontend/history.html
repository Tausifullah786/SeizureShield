<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>History · SeizureShield</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <div class="layout">
    <div id="sidebar-slot"></div>

    <main class="main">
      <div class="page-head">
        <div>
          <div class="eyebrow">Audit trail</div>
          <h1>History</h1>
          <p class="subtitle">Every analysis run on a patient assigned to you, newest first.</p>
        </div>
        <div>
          <label for="filter" style="display:block;font-weight:600;margin-bottom:6px">Show</label>
          <select id="filter" style="padding:11px 14px;border:1px solid #e2e8f0;border-radius:6px;min-width:200px">
            <option value="all">All results</option>
            <option value="preictal">Preictal only</option>
            <option value="interictal">Interictal only</option>
          </select>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Patient</th>
              <th>Result</th>
              <th>Confidence</th>
              <th>Windows</th>
              <th>File</th>
            </tr>
          </thead>
          <tbody id="list">
            <tr>
              <td colspan="6" class="muted" style="padding:32px;text-align:center">Loading…</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script>
    let all = [];
    if (initLayout("history")) load();

    async function load() {
      try {
        all = await api.listAnalyses();
        render();
      } catch (e) {
        document.getElementById("list").innerHTML =
          `<tr><td colspan="6" class="muted" style="padding:32px;text-align:center">${e.message}</td></tr>`;
      }
    }

    function render() {
      const filter = document.getElementById("filter").value;
      const rows = filter === "all"
        ? all
        : all.filter(a => a.prediction.predictedClass === filter);

      const body = document.getElementById("list");
      if (!rows.length) {
        body.innerHTML = `<tr><td colspan="6">
          <div class="empty"><h3>Nothing to show</h3>
          <p>No analyses match this filter.</p></div>
        </td></tr>`;
        return;
      }

      body.innerHTML = rows.map(a => `
        <tr class="clickable" onclick="location.href='result.html?id=${a.id}'">
          <td class="muted">${formatDate(a.createdAt)}</td>
          <td><strong>${a.patientName}</strong></td>
          <td>${statusBadge(a.prediction.status)}</td>
          <td>${(a.prediction.confidence * 100).toFixed(1)}%</td>
          <td>${a.windowsAnalysed}</td>
          <td class="muted">${a.csvFileName}</td>
        </tr>`).join("");
    }

    document.getElementById("filter").onchange = render;
  </script>
</body>

</html>
