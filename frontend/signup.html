<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account · SeizureShield</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <div class="auth-wrap">
    <div class="auth-box">
      <div class="logo">Seizure<span>Shield</span></div>
      <p class="tag">Create your clinician account.</p>

      <div id="error" class="alert error hidden"></div>

      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name">
      </div>
      <div class="field">
        <label for="specialty">Specialty</label>
        <input type="text" id="specialty" value="Neurology">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="new-password">
        <small class="muted">At least 6 characters.</small>
      </div>

      <button class="btn" style="width:100%" id="submit">Create account</button>

      <p class="auth-foot">Already registered? <a href="login.html">Sign in</a></p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    const errorBox = document.getElementById("error");

    document.getElementById("submit").onclick = async () => {
      errorBox.classList.add("hidden");
      const btn = document.getElementById("submit");
      btn.disabled = true;
      try {
        const data = await api.signup({
          name: document.getElementById("name").value.trim(),
          specialty: document.getElementById("specialty").value.trim() || "Neurology",
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value,
        });
        auth.save(data.access_token, data.doctor);
        window.location.href = "dashboard.html";
      } catch (e) {
        errorBox.textContent = e.message;
        errorBox.classList.remove("hidden");
        btn.disabled = false;
      }
    };
  </script>
</body>

</html>
